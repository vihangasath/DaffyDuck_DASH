# Render Blueprint: Dashboard → New → Blueprint → this repository. Deploys from main.
#   daffyduck-dash-db    Postgres 17
#   daffyduck-dash-api   Waypoint API: migrations + first-run seed (the synthetic fixture: data/ is not in the repo)
#   daffyduck-dash       DASH operations app
#   daffyduck-people     Waypoint People (HR)
# Render has no build-target setting, so SERVICE picks the Dockerfile stage (Render passes env vars as build args).
# Free web services can't receive private-network traffic, so the apps reach the API by its public URL.
# API_URL is fixed at build time: if Render gives a service a different .onrender.com URL (name taken),
# correct API_URL / ADMIN_URL in the dashboard and redeploy that service.
databases:
  - name: daffyduck-dash-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: waypoint
    user: waypoint

services:
  - name: daffyduck-dash-api
    type: web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SERVICE
        value: api
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase: { name: daffyduck-dash-db, property: connectionString }
      - key: ADMIN_URL
        value: https://daffyduck-people.onrender.com
      - key: SESSION_HOURS
        value: "12"

  - name: daffyduck-dash
    type: web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SERVICE
        value: web
      - key: PORT
        value: "3000"
      - key: API_URL
        value: https://daffyduck-dash-api.onrender.com

  - name: daffyduck-people
    type: web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SERVICE
        value: admin
      - key: PORT
        value: "3001"
      - key: API_URL
        value: https://daffyduck-dash-api.onrender.com
