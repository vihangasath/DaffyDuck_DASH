# `docker compose up --build` starts the whole system:
#   db     Postgres 17 (data kept in the pgdata volume)
#   api    Waypoint API: migrations + first-run seed, auth, business rules, audit log  (:4000)
#   web    operations app for dispatchers, loaders, drivers and store managers         (:3000)
#   admin  admin console                                                               (:3001)
# Optional Datathon models (apps/models): `docker compose --profile models up --build` with
# MODEL_URL=http://models:8000 in .env. Without them the app uses its built-in baselines.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://waypoint:${POSTGRES_PASSWORD:-waypoint}@db:5432/waypoint
      ADMIN_URL: http://localhost:${ADMIN_PORT:-3001}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      MODEL_URL: ${MODEL_URL:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["${API_PORT:-4000}:4000"]
    restart: unless-stopped

  web:
    build: { context: ., target: web, args: { API_URL: http://api:4000 } }
    depends_on: [api]
    ports: ["${WEB_PORT:-3000}:3000"]
    restart: unless-stopped

  admin:
    build: { context: ., target: admin, args: { API_URL: http://api:4000 } }
    depends_on: [api]
    ports: ["${ADMIN_PORT:-3001}:3001"]
    restart: unless-stopped

  models:
    profiles: [models]
    build: { context: ./apps/models }
    environment:
      MODEL_NAME: ${MODEL_NAME:-datathon}
    volumes: ["./apps/models/artifacts:/app/artifacts:ro"]
    restart: unless-stopped

volumes:
  pgdata:
